name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting and lint (Biome)
        run: bun run check

      - name: Check TypeScript types
        run: bun run typecheck

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Run unit tests
        run: bun test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  types-compatibility-check:
    name: Type Resolution Check (attw)
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check types compatibility across resolution modes (Node10, Node16, Bundler)
        run: bun x @arethetypeswrong/cli --pack .

  runtime-matrix-smoke-test:
    name: Runtime Smoke Test (${{ matrix.runtime }})
    needs: [build-and-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - node-esm
          - node-cjs
          - bun
          - deno
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Node.js ESM Smoke Test
      - name: Setup Node.js
        if: matrix.runtime == 'node-esm' || matrix.runtime == 'node-cjs'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test import in Node.js (ESM)
        if: matrix.runtime == 'node-esm'
        run: node --input-type=module -e 'import { SingleId, RangeId, FlexId } from "./dist/index.js"; console.log("Node ESM OK:", SingleId.create(5, 3, 2, 10).toString());'

      # Node.js CommonJS Smoke Test
      - name: Test require in Node.js (CommonJS)
        if: matrix.runtime == 'node-cjs'
        run: node -e 'const { SingleId, RangeId, FlexId } = require("./dist/index.cjs"); console.log("Node CJS OK:", SingleId.create(5, 3, 2, 10).toString());'

      # Bun Smoke Test
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test import in Bun
        if: matrix.runtime == 'bun'
        run: bun -e 'import { SingleId, RangeId, FlexId } from "./dist/index.js"; console.log("Bun OK:", SingleId.create(5, 3, 2, 10).toString());'

      # Deno Smoke Test
      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test import in Deno
        if: matrix.runtime == 'deno'
        run: deno run -e 'import { SingleId, RangeId, FlexId } from "./dist/index.js"; console.log("Deno OK:", SingleId.create(5, 3, 2, 10).toString());'
