name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Check, Test & Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and format check
        run: bun run check

      - name: Run unit tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Pack package
        run: npm pack && mv ./*.tgz package.tgz

      - name: Check types across resolution modes (attw)
        run: bun x @arethetypeswrong/cli package.tgz

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package.tgz
          retention-days: 1

  # 公開後と同じ条件で検証するため、リポジトリではなく tarball を空のプロジェクトにインストールする。
  runtime-smoke-test:
    name: Runtime Smoke Test (${{ matrix.runtime }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node-esm, node-cjs, bun, deno]
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install package into empty project
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install ../package.tgz

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Import package
        working-directory: consumer
        run: |
          esm='import { SingleId } from "@airbee-project/kasane-client"; console.log(SingleId.create(5, 3, 2, 10).toString());'
          cjs='const { SingleId } = require("@airbee-project/kasane-client"); console.log(SingleId.create(5, 3, 2, 10).toString());'
          case "${{ matrix.runtime }}" in
            node-esm) node --input-type=module -e "$esm" ;;
            node-cjs) node -e "$cjs" ;;
            bun) bun -e "$esm" ;;
            deno) deno eval "$esm" ;;
          esac

  consumer-typecheck:
    name: Consumer Typecheck (${{ matrix.format }}, ${{ matrix.resolution }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: commonjs, resolution: node16 }
          - { format: module, resolution: node16 }
          - { format: module, resolution: bundler }
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install package and TypeScript into empty project
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm pkg set type=${{ matrix.format }}
          npm install ../package.tgz typescript@5

      # attw は宣言ファイル内の ESM/CJS 不整合 (TS1479 など) を検出しないため、実際の利用者として型チェックする。
      - name: Typecheck consumer
        working-directory: consumer
        run: |
          echo 'import { SingleId } from "@airbee-project/kasane-client"; export const id: SingleId = SingleId.create(5, 3, 2, 10);' > index.ts
          if [ "${{ matrix.resolution }}" = bundler ]; then module=esnext; else module=node16; fi
          npx tsc --noEmit --strict --lib es2022,dom --module "$module" --moduleResolution ${{ matrix.resolution }} index.ts
