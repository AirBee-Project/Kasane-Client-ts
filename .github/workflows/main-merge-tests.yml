name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "wasm/**"
      - "scripts/**"
      - "playground/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "biome.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wasm/**"
      - "scripts/**"
      - "playground/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "biome.json"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI checks (Typecheck, Format, Lint, Test)
        run: bun run ci

      - name: Build package
        run: bun run build

  server:
    name: Compare with LMDB Kasane server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Kasane
        uses: actions/checkout@v4
        with:
          repository: AirBee-Project/Kasane
          ref: main
          path: kasane

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Kasane
        run: cargo build --manifest-path kasane/Cargo.toml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests against the server
        run: |
          DATABASE_DIR="$RUNNER_TEMP/kasane_db" PORT=5172 ROOT_PASSWORD=password \
            ./kasane/target/debug/kasane &
          until (exec 3<>/dev/tcp/127.0.0.1/5172) 2>/dev/null; do sleep 1; done
          KASANE_URL=http://127.0.0.1:5172 bun run test
