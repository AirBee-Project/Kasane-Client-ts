name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "proto/**"
      - "playground/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "biome.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "proto/**"
      - "playground/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "biome.json"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI checks (Typecheck, Format, Lint, Test)
        run: bun run ci

      - name: Build package
        run: bun run build
