[package]
name = "spatial-id-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
spatial-id = { git = "https://github.com/AirBee-Project/spatial-id-rs.git", branch = "main", default-features = false, features = ["temporal_id"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
