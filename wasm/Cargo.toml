[package]
name = "kasane-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# 生成コード（src/client/gen）もこのリビジョンの proto から作る。更新は `bun run generate`。
kasane = { git = "https://github.com/AirBee-Project/Kasane.git", branch = "main", default-features = false }
js-sys = "0.3"
tonic-types = "0.14.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
